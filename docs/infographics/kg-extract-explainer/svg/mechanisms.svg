<text x="34" y="317" font-size="11.5" fill="#5A6B84" font-weight="700" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">62 KB 手册实测</text>
<text x="184" y="317" font-size="11.5" fill="#1D4ED8" font-weight="700" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">simple（每段并发）</text>
<text x="614" y="317" font-size="11.5" fill="#0284C7" font-weight="700" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">agentic（单会话串行）</text>
<rect x="24" y="324" width="1010" height="24" rx="0" fill="#FAFBFE"/>
