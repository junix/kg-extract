<text x="24" y="254" font-size="16" fill="#1E3A8A" font-weight="700" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">第四条机制：agentic —— 换一种取舍</text>
<text x="24" y="278.0" font-size="12.5" fill="#16233B" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">整篇文档进一个连续多轮会话：全文写入隔离目录，智能体在只读工具沙箱（Read/Grep/Glob，无写入/执行）里按切片工作。同一会话携带上下文，模型跨切片复用实体名——共指发生在抽取时</text>
<text x="24" y="297.375" font-size="12.5" fill="#16233B" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">，而不是事后合并。</text>
