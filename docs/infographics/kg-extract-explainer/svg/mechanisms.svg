<text x="184" y="340" font-size="11.5" fill="#16233B" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">516（碎片化：一个术语裂成约 7 个节点）</text>
<text x="614" y="340" font-size="11.5" fill="#16233B" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">136（合并：一个节点）</text>
<text x="34" y="366" font-size="11.5" fill="#5A6B84" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">孤儿率</text>
