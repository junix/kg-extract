<text x="24" y="458" font-size="10.5" fill="#8A97AB" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">62 KB 手册数字为引擎文档记录值（证据记录 D08）；三机制收敛数字来自本页冻结实跑（C05）。</text>
