<rect x="24" y="376" width="1010" height="24" rx="0" fill="#FAFBFE"/>
<text x="34" y="392" font-size="11.5" fill="#5A6B84" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">速度</text>
<text x="184" y="392" font-size="11.5" fill="#16233B" font-weight="normal" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">快（分段并发）</text>
